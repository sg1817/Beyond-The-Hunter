
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beyond the Hunter | Acesso</title>

    <link rel="stylesheet" href="../css/auth.css">
    <link rel="shortcut icon" href="../img/trupe.ico" type="image/x-icon">

    <script type="module" src="../JavaScript/auth.js"></script>
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <h1>BEYOND THE HUNTER</h1>

            <p class="subtitle">
                Sua jornada começa aqui.
            </p>

            <div class="auth-tabs">
                <button id="loginTab" class="active">
                    Entrar
                </button>

                <button id="registerTab">
                    Criar conta
                </button>
            </div>

            <form id="authForm">

                <div id="nameGroup" class="hidden">
                    <label for="name">Nome de usuário</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Como deseja ser chamado?"
                    >
                </div>

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                    required
                >

                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    minlength="6"
                    required
                >

                <button type="submit" id="submitButton">
                    Entrar
                </button>

            </form>

            <p id="message"></p>

        </section>

    </main>

</body>
</html>
